# xcodegen spec for STMP (iOS). The generated STMP.xcodeproj is gitignored and never committed (D3).
# Sources are directory based, so adding a file never edits this file. Every path a later ticket fills exists with a
# .gitkeep or is optional, so xcodegen never fails on a missing path (D112).
name: STMP
options:
  bundleIdPrefix: com.mido
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Release
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # D55: iPhone only, one scene.
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    # Never sign from a script (Q4). The DoD also passes CODE_SIGNING_ALLOWED=NO on the command line.
    CODE_SIGNING_ALLOWED: NO
packages:
  STMPKit:
    path: STMPKit
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.7
targets:
  STMP:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: STMP
        PRODUCT_BUNDLE_IDENTIFIER: com.mido.stmp
        # D6: the app target is MainActor by default; the package is nonisolated by default.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # D54/D90: pinned so the isolation of platform adapters never depends on an Xcode default. The
        # NonisolatedNonsendingByDefault upcoming feature is deliberately NOT enabled.
        SWIFT_APPROACHABLE_CONCURRENCY: NO
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: .derived/Info/STMP-Info.plist
    info:
      path: .derived/Info/STMP-Info.plist
      properties:
        CFBundleDisplayName: STMP
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSFaceIDUsageDescription: STMP uses Face ID to unlock the vault and to approve requests.
        NSContactsUsageDescription: STMP reads your contacts only when you approve a request that searches them.
        NSLocalNetworkUsageDescription: STMP serves its API on your Tailscale network so your agents can reach this iPhone.
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - GeistMono-SemiBold.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.mido.stmp.google
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        STMPGoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        UIFileSharingEnabled: false
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # No UIBackgroundModes (Q7), and no NSAppTransportSecurity exception (D81): the app serves inbound traffic and its
        # outbound calls are https only.
    dependencies:
      - package: STMPKit
        product: STMPCore
      - package: STMPKit
        product: STMPHTTP
      - package: STMPKit
        product: STMPDispatch
      - package: STMPKit
        product: STMPPluginsCore
      - package: STMPKit
        product: STMPPolicy
      - package: STMPKit
        product: STMPAudit
      - package: STMPKit
        product: STMPGate
      - package: STMPKit
        product: STMPVault
      - package: STMPKit
        product: STMPSecrets
      - package: STMPKit
        product: STMPText
      - package: STMPKit
        product: STMPGoogle
      - package: STMPKit
        product: STMPGmail
      - package: STMPKit
        product: STMPCalendar
      - package: STMPKit
        product: STMPDrive
      - package: STMPKit
        product: STMPDevice
      - package: STMPKit
        product: STMPSSH
      - package: STMPKit
        product: STMPBridge
  STMPTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: STMP
      - package: STMPKit
        product: STMPTestSupport
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mido.stmp.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/STMP.app/STMP
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_APPROACHABLE_CONCURRENCY: NO
  STMPUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
        optional: true
        excludes:
          - "**/.gitkeep"
      - path: App/Sources/App/AXID.swift
      - path: App/Sources/Features
        includes:
          - "**/AXID+*.swift"
    dependencies:
      - target: STMP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mido.stmp.uitests
        INFOPLIST_FILE: Config/UITests-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET_NAME: STMP
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_APPROACHABLE_CONCURRENCY: NO
schemes:
  STMP:
    build:
      targets:
        STMP: all
        STMPTests: [test]
        STMPUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Pinned locale and zone (D46, D70); snapshot record mode reaches the runner via TEST_RUNNER_SNAPSHOT_TESTING_RECORD.
      environmentVariables:
        TZ: UTC
      commandLineArguments:
        "-AppleLanguages (en)": true
        "-AppleLocale en_US_POSIX": true
      targets:
        - name: STMPTests
        - name: STMPUITests
    profile:
      config: Release
    archive:
      config: Release
